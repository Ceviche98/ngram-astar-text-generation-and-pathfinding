[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-search-nlp"
version = "1.0.0"
description = "Topological Text Networks, Simulated Annealing Simple-Path Optimization, and Constrained Statistical Text Generation via Length-Normalised A* Search with N-Gram Backoff & Reverse-BFS Heuristics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Oscar Moreno" }
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
